services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      - POSTGRES_USER=paet
      - POSTGRES_PASSWORD=paet
      - POSTGRES_DB=paet_db
    volumes:
      - paet_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  executor:
    build: ./backend/executor
    networks: [sandbox]
    read_only: true
    tmpfs:
      # exec is required: compiled C++ binaries are written here and executed.
      # Docker defaults tmpfs to noexec, which silently breaks every C++ submission.
      - /tmp:rw,exec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides any DATABASE_URL in backend/.env. To use another Postgres, remove
      # this line and the db dependency, and migrate that database first.
      - DATABASE_URL=postgresql://paet:paet@db:5432/paet_db
      - EXECUTOR_URL=http://executor:8080
    depends_on:
      db:
        condition: service_healthy
      executor:
        condition: service_started
    networks: [default, sandbox]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

networks:
  sandbox:
    internal: true

volumes:
  paet_pgdata:
