# Development stack with a local Postgres on host port 5433.
#   docker compose -f docker-compose.dev.yml up -d --build
# Host venv / Alembic: DATABASE_URL=postgresql://aita:aita@localhost:5433/aita_db
# docker-compose.yml is the self-hosting stack described in the README.
services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      - POSTGRES_USER=aita
      - POSTGRES_PASSWORD=aita
      - POSTGRES_DB=aita_db
    ports:
      # 5433: the native Windows Postgres already holds 5432.
      - "5433:5432"
    volumes:
      - aita_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aita -d aita_db"]
      interval: 2s
      timeout: 3s
      retries: 15

  executor:
    build: ./backend/executor
    networks: [sandbox]
    read_only: true
    tmpfs:
      # exec is required: compiled C++ binaries are written here and executed.
      # Docker defaults tmpfs to noexec, which silently breaks every C++ submission.
      - /tmp:rw,exec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://aita:aita@db:5432/aita_db
      - EXECUTOR_URL=http://executor:8080
      - HF_HOME=/hf-cache
    volumes:
      - hf_cache:/hf-cache
    depends_on:
      db:
        condition: service_healthy
      executor:
        condition: service_started
    networks: [default, sandbox]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

networks:
  sandbox:
    internal: true

volumes:
  aita_pgdata:
  hf_cache:
